<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Cashflows — дашборд личных финансов</title>
    <script>
        // Выставляем data-theme до первой отрисовки — иначе страница на мгновение
        // мигнёт светлой темой, пока React и useTheme (см. web/src/hooks/useTheme.ts) не применят
        // сохранённое в localStorage предпочтение. По умолчанию — светлая тема.
        (function () {
            try {
                if (localStorage.getItem('cashflows-theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {
                // localStorage недоступен — остаёмся на светлой теме по умолчанию
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
